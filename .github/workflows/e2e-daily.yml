name: E2E Daily

# Corre la suite E2E contra un BUILD LOCAL de producción (next start) apuntando
# al proyecto Supabase de TEST, con datos sembrados. NUNCA contra el sitio real:
# la suite crea/edita/borra datos y correrla contra producción sería destructivo.
#
# Requiere estos secrets (del proyecto Supabase de TEST, no producción):
#   SUPABASE_TEST_URL, SUPABASE_TEST_ANON_KEY, SUPABASE_TEST_SECRET_KEY, DATABASE_TEST_URL

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E (build local + Supabase de test)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_TEST_SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_TEST_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - name: Build de producción
        run: pnpm build

      - name: Sembrar datos de test
        run: pnpm seed:e2e

      - name: Ejecutar E2E (next start local)
        run: pnpm test:e2e
        env:
          E2E_PROD: "1"

      - name: Subir reporte Playwright
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
